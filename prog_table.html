<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Таблица Менделеева Программирования</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&family=Unbounded:wght@400;700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:#f4f2ef;
  color:#222;
  font-family:'JetBrains Mono',monospace;
  min-height:100vh;
  overflow-x:auto;
  padding:20px 20px 40px;
}
h1{
  font-family:'Unbounded',sans-serif;
  text-align:center;
  font-size:clamp(1.1rem,2.8vw,2rem);
  margin:8px 0 2px;
  color:#1a1a1a;
  letter-spacing:1px;
}
h1 span{
  background:linear-gradient(90deg,#e63946,#f4a261,#2a9d8f,#264653);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}
.subtitle{
  text-align:center;
  font-size:.65rem;
  color:#999;
  margin-bottom:14px;
  letter-spacing:3px;
  text-transform:uppercase;
}
.legend{
  display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-bottom:14px;
}
.legend-item{display:flex;align-items:center;gap:5px;font-size:.58rem;color:#666}
.legend-dot{width:10px;height:10px;border-radius:3px}

.grid{
  display:grid;
  grid-template-columns:repeat(18,1fr);
  gap:3px;
  max-width:1350px;
  margin:0 auto;
  min-width:920px;
}
.cell{
  aspect-ratio:1;
  border-radius:8px;
  padding:3px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  cursor:pointer;
  transition:all .2s ease;
  position:relative;
  overflow:visible;
  border:1px solid rgba(0,0,0,.07);
  min-width:0;
  box-shadow:0 1px 3px rgba(0,0,0,.04);
}
.cell:hover{
  transform:scale(1.15);
  z-index:10;
  box-shadow:0 4px 20px rgba(0,0,0,.12);
}
.cell .num{font-size:.42rem;color:rgba(0,0,0,.3);position:absolute;top:2px;left:4px}
.cell .sym{font-size:clamp(.65rem,1.3vw,1.05rem);font-weight:800;line-height:1.1}
.cell .name{font-size:.36rem;text-align:center;line-height:1.1;opacity:.55;margin-top:1px}
.cell .mass{font-size:.3rem;opacity:.3;margin-top:1px}
.empty{background:transparent!important;border:none!important;box-shadow:none!important;pointer-events:none}

.tip{
  display:none;
  position:absolute;
  bottom:calc(100% + 10px);
  left:50%;
  transform:translateX(-50%);
  width:280px;
  background:#fff;
  border:1px solid rgba(0,0,0,.1);
  border-radius:12px;
  padding:12px 14px;
  font-size:.62rem;
  color:#333;
  z-index:500;
  pointer-events:none;
  box-shadow:0 12px 40px rgba(0,0,0,.12);
  line-height:1.55;
  text-align:left;
  white-space:normal;
}
.tip::after{
  content:'';position:absolute;top:100%;left:50%;transform:translateX(-50%);
  border:6px solid transparent;border-top-color:#fff;
}
.tip .tip-head{
  display:flex;align-items:center;gap:6px;margin-bottom:6px;
  padding-bottom:6px;border-bottom:1px solid #eee;
}
.tip .tip-sym{font-size:1.1rem;font-weight:800}
.tip .tip-title{font-weight:700;font-size:.7rem}
.tip .tip-cat{font-size:.5rem;opacity:.5;margin-left:auto;text-transform:uppercase;letter-spacing:1px}
.tip .tip-body{color:#555}
.cell:hover .tip{display:block}

/* edge-aware tooltip positioning */
.edge-left .tip{left:0;transform:none}
.edge-left .tip::after{left:20px;transform:none}
.edge-right .tip{left:auto;right:0;transform:none}
.edge-right .tip::after{left:auto;right:20px;transform:none}

.cat-lang{background:#e8f5e9;color:#2e7d32;border-color:#c8e6c9}
.cat-bug{background:#ffebee;color:#c62828;border-color:#ffcdd2}
.cat-tool{background:#e3f2fd;color:#1565c0;border-color:#bbdefb}
.cat-concept{background:#fff8e1;color:#f57f17;border-color:#ffecb3}
.cat-human{background:#f3e5f5;color:#7b1fa2;border-color:#e1bee7}
.cat-infra{background:#e0f7fa;color:#00838f;border-color:#b2ebf2}
.cat-data{background:#fff3e0;color:#e65100;border-color:#ffe0b2}
.cat-myth{background:#f5f5f5;color:#616161;border-color:#e0e0e0}
</style>
</head>
<body>

<h1>⚛ <span>ПЕРИОДИЧЕСКАЯ ТАБЛИЦА ПРОГРАММИРОВАНИЯ</span> ⚛</h1>
<p class="subtitle">Версия 4.0.4 · Все элементы нестабильны по пятницам</p>

<div class="legend">
  <div class="legend-item"><div class="legend-dot" style="background:#66bb6a"></div>Языки</div>
  <div class="legend-item"><div class="legend-dot" style="background:#ef5350"></div>Баги</div>
  <div class="legend-item"><div class="legend-dot" style="background:#42a5f5"></div>Инструменты</div>
  <div class="legend-item"><div class="legend-dot" style="background:#ffca28"></div>Концепции</div>
  <div class="legend-item"><div class="legend-dot" style="background:#ab47bc"></div>Человеческий фактор</div>
  <div class="legend-item"><div class="legend-dot" style="background:#26c6da"></div>Инфраструктура</div>
  <div class="legend-item"><div class="legend-dot" style="background:#ffa726"></div>Данные</div>
  <div class="legend-item"><div class="legend-dot" style="background:#9e9e9e"></div>Мифические</div>
</div>

<div class="grid" id="table"></div>

<script>
const E=(n,s,name,mass,cat,desc)=>({n,s,name,mass,cat,desc});
const catNames={lang:'Язык',bug:'Баг',tool:'Инструмент',concept:'Концепция',human:'Человеческий фактор',infra:'Инфраструктура',data:'Данные',myth:'Мифический'};

const elements=[
[1,1, E(1,'Js','JavaScript','∞ кг','lang','Язык, в котором [] + [] даёт пустую строку, а [] + {} — «[object Object]». Создан за 10 дней и мучает разработчиков уже 30 лет. Typeof NaN === "number" — и это не баг, а философия.')],
[1,2, E(2,'Py','Python','🐍','lang','Единственный язык, где пробел vs таб может стоить вам работы. Идеален для прототипов, дата-сайенса и скриптов, которые «временно» крутятся в продакшне уже 5 лет.')],
[1,5, E(3,'Nj','Node.js','404','tool','Серверный JavaScript — потому что одного фронтенда было мало для страданий. Однажды удаление 11-строчного npm-пакета left-pad положило полинтернета.')],
[1,6, E(4,'Rct','React','18.x','tool','Библиотека, где состояние — это хаос. Каждые 6 месяцев — новый способ делать то же самое. Классы? Хуки? Серверные компоненты? Сигналы? Пристегнитесь.')],
[1,11,E(5,'AI','ИИ-код','GPT','myth','Революция: вместо копирования со StackOverflow мы копируем из ChatGPT. Прогресс! Код работает с первого раза в 40% случаев — это, кстати, лучше, чем у некоторых джунов.')],
[1,17,E(6,'Bg','Баг','∞','bug','Фундаментальная частица программирования. Не создаётся и не уничтожается — только перемещается в другой модуль. Закон сохранения багов: их количество в системе постоянно.')],
[1,18,E(7,'Fx','Фикс','0.01','bug','Квантовый объект: наблюдение меняет его состояние. Исправил 1 баг — создал 3 новых. Фикс в пятницу гарантированно порождает субботний инцидент. Лучшая стратегия — не трогать.')],

[2,1, E(8,'C','Си','1972','lang','Дедушка всех языков. Полный контроль над памятью = полная ответственность за утечки. Указатели на указатели на указатели — йога для мозга и причина седых волос.')],
[2,2, E(9,'C+','C++','11/14/17','lang','Си с классами, шаблонами, исключениями и 1400-страничным стандартом. Время компиляции крупного проекта измеряется в перерывах на кофе. Template errors — отдельный жанр хоррора.')],
[2,3, E(10,'Rs','Rust','🦀','lang','Язык, который заставляет писать правильный код путём шантажа. Borrow checker — строгий, но справедливый надзиратель вашей памяти. Фанаты обязаны упомянуть Rust в любом разговоре.')],
[2,4, E(11,'Go','Go','1.21','lang','Минималистичный язык от Google. 50% кода — if err != nil. Дженерики добавили в 2022 — сообщество до сих пор в шоке. Горутины — как потоки, только весело.')],
[2,5, E(90,'1С','1С','🇷🇺','lang','Язык, где переменные пишутся кириллицей: Если Сумма > 0 Тогда. Единственная экосистема, где бухгалтер — главный тестировщик, а «Процедура» звучит как медицинский диагноз. Конфигуратор — портал в другое измерение, откуда не все возвращаются. Жёлтый цвет интерфейса навсегда выжжен на сетчатке 1С-ников. Платформа пережила 3 версии Windows, 2 кризиса и бесконечные обновления законодательства — и работает. Как-то.')],
[2,6, E(91,'C#','C#','♯','lang','Ответ Microsoft на Java. LINQ — лучшее, что случалось с коллекциями. async/await — лучшее, что случалось с асинхронностью. А потом все остальные языки это скопировали. Гордость и предубеждение корпоративной разработки.')],
[2,7, E(92,'.NT','.NET','🟣','infra','Фреймворк, который менял имя чаще, чем рэпер: .NET Framework → .NET Core → .NET 5 → 6 → 7 → 8. Каждый раз «теперь точно кроссплатформенный!». NuGet-пакеты — как node_modules, но в костюме.')],
[2,13,E(12,'Sw','Swift','5.9','lang','Язык Apple, где Optional<Optional<Optional<String>>> — валидный тип. Xcode падает чаще, чем ваше приложение. SwiftUI — красиво, но preview опять сломался.')],
[2,14,E(13,'Kt','Kotlin','♨','lang','Java на стероидах и антидепрессантах. Null safety, data classes, extension functions — всё, о чём Java-разработчики мечтали 20 лет. Google одобряет.')],
[2,15,E(14,'Rb','Ruby','💎','lang','Язык, оптимизированный для счастья разработчика. Rails показал всем, как делать веб. Потом все ушли на Node. Ruby тихо грустит в углу, но всё ещё прекрасен.')],
[2,16,E(15,'Ph','PHP','8.2','lang','Язык, который хоронят с 2005 года, а он работает на 77% сайтов. PHP 8 реально хорош, но признать это вслух в IT-сообществе — социальный суицид.')],
[2,17,E(16,'Sg','Segfault','💀','bug','Ваша программа полезла в чужую память — ОС вызвала охрану. Core dump — посмертная фотография процесса. Причина обычно: забытый malloc или лишний free.')],
[2,18,E(17,'Nl','Null','∅','bug','Тони Хоар назвал его «ошибкой на миллиард долларов», но с инфляцией это уже триллион. NullPointerException — самый популярный exception в истории Java и C#.')],

[3,1, E(18,'Gt','Git','🌿','tool','Система контроля версий, написанная Линусом за 2 недели. 95% разработчиков знают 5 команд. git rebase vs merge — священная война, уносящая дружбы и рабочие отношения.')],
[3,2, E(19,'Dk','Docker','🐳','tool','Виртуализация для тех, кому VM было мало. Dockerfile на 3 строки → образ на 2 ГБ. «На моём контейнере работает» — новая версия «на моей машине работает».')],
[3,3, E(20,'K8','Kubernetes','☸','infra','Система для управления контейнерами, которая сама требует команду для управления. YAML-файлов больше, чем звёзд во вселенной. «Нам нужен K8s» = бюджет ×3.')],
[3,4, E(21,'Lx','Linux','🐧','infra','ОС, где всё — файл, включая вашу волю к жизни. Пользователи Arch обязаны сообщить об этом в первые 30 секунд знакомства. Это закон, btw.')],
[3,5, E(22,'Vs','VS Code','📝','tool','Редактор от Microsoft, захвативший мир. Начинается как текстовый редактор, заканчивается как Electron-монстр, пожирающий RAM. 200 расширений — стандартный набор.')],
[3,6, E(23,'Vi','Vim','🚪','tool','Текстовый редактор с кривой обучения в форме стены. Миллионы разработчиков заперты в Vim. Тысячи запросов «how to exit vim» ежемесячно. :q! — заклинание свободы.')],
[3,7, E(24,'Em','Emacs','🎹','tool','Не редактор, а операционная система, которой не хватает хорошего редактора. Можно читать почту, играть в тетрис и варить кофе. Ctrl+Meta+Hyper+Shift+A — обычная комбинация.')],
[3,8, E(25,'Tm','Terminal','▶','tool','Чёрное окно: либо пугает, либо даёт ощущение хакера из кино. Одна опечатка — прощай файловая система. sudo rm -rf / — страшилка для джунов.')],
[3,9, E(26,'Aw','AWS','☁','infra','200+ сервисов с непроизносимыми названиями. Забытый EC2-инстанс на выходные стоит как подержанная машина. «Бесплатный тир» — самая дорогая ловушка в IT.')],
[3,10,E(27,'Az','Azure','🔷','infra','Облако от Microsoft, интерфейс которого меняется каждый вторник. Портал загружается ровно столько, сколько нужно для заваривания чая. Интеграция с AD — главный аргумент.')],
[3,11,E(28,'SO','StackOverflow','📚','tool','Главный источник кода и знаний человечества. «Как центрировать div?» — 47 ответов, 3 закрыты как дубликат, 1 правильный, и тот от 2009 года.')],
[3,12,E(29,'Gh','GitHub','🐙','tool','Социальная сеть для кода. Зелёные квадратики — валюта разработчика. Описания коммитов деградируют от «Added auth module» до «asdf» к пятнице.')],
[3,13,E(30,'Ci','CI/CD','🔄','infra','Код проходит 47 проверок и ломается на 48-й — продакшн. Зелёный пайплайн — редкое явление, сравнимое с солнечным затмением. Красный — норма.')],
[3,14,E(31,'Ng','Nginx','⚡','infra','Веб-сервер, который ставят перед всем. Конфиг nginx — чёрная магия, понятная 3 людям на планете. Остальные копируют из StackOverflow. И это работает.')],
[3,15,E(32,'Db','Debug','🔍','tool','Искусство поиска бага, который вы сами создали вчера в 3 AM. Дебаггер существует, но console.log("СЮДА ДОШЛО??") надёжнее — проверено поколениями.')],
[3,16,E(33,'Lg','Лог','📜','tool','Летопись серверов. [INFO] Запуск... [WARN] Диск 90%... [ERROR] Ой... [FATAL] ☠. Никто не читает логи, пока прод не упадёт. Потом читают все одновременно.')],
[3,17,E(34,'Rc','Race Cond.','🏎','bug','Два потока, одна переменная, ноль гарантий. Воспроизводится только в продакшне, по вторникам, при полной луне. Отладка — как ловить привидение голыми руками.')],
[3,18,E(35,'Dp','Дедлок','🔒','bug','Два процесса заперли друг друга навечно. Как двое в дверном проёме: «Нет, вы первый!» — «Нет, вы!» — и система зависает до перезагрузки.')],

[4,1, E(36,'Sq','SQL','📊','data','Язык запросов, которому 50 лет, и он моложе ваших микросервисов. LEFT JOIN, RIGHT JOIN, INNER JOIN — но настоящий джойн — с теми, кто забывает WHERE в DELETE.')],
[4,2, E(37,'Mg','MongoDB','🍃','data','NoSQL-база, где можно хранить что угодно в любом формате. Свобода! Хаос! Через год: «может, нам всё-таки нужна была схема…»')],
[4,3, E(38,'Rd','Redis','🔴','data','Инмемори хранилище быстрее мысли. Кэш, очередь, БД и замок — всё в одном. Перезагрузка = потеря памяти. Как рыбка Дори, но для данных.')],
[4,4, E(39,'Pg','PostgreSQL','🐘','data','Самая продвинутая open-source БД. Умеет JSON, геоданные, полнотекстовый поиск и, кажется, ваши налоги. Слоник с характером и 30-летним стажем.')],
[4,5, E(40,'Ap','API','🔌','concept','Интерфейс между системами. Каждые 3 года — «убийца REST», а REST всё жив. Документация API устаревает за время чтения первой страницы.')],
[4,6, E(41,'Jn','JSON','{}','data','Формат данных, покоривший мир. Trailing comma запрещена — и это преступление против человечности. Один пропущенный символ — и парсер превращается в тыкву.')],
[4,7, E(42,'Xm','XML','</>','data','Формат, который казался хорошей идеей в 1998. Теперь живёт в корпоративном софте и Spring-конфигах. XSLT — когда вы ненавидите и себя, и данные.')],
[4,8, E(43,'Ym','YAML','⚠','data','«Человекочитаемый» формат, нечитаемый для людей. Один лишний пробел — и K8s деплоит в Нарнию. "Norway" парсится как false. Серьёзно. Это не шутка.')],
[4,9, E(44,'Rg','Regex','.*','concept','«У вас проблема. Вы решили использовать regex. Теперь у вас 2 проблемы.» Регулярные выражения выглядят как пароль от Wi-Fi соседа, но работают. Иногда.')],
[4,10,E(45,'Cr','CORS','🚫','bug','Cross-Origin Resource Sharing: механизм безопасности, блокирующий ваш собственный API. Решение: «добавь * в Allow-Origin» — и заплачь от стыда.')],
[4,11,E(46,'Cs','CSS','🎨','lang','Центрирование div было нерешённой задачей 20 лет. Flexbox спас мир, но specificity wars продолжаются. !important — белый флаг разработчика.')],
[4,12,E(47,'Ht','HTML','📄','lang','HyperText Markup Language. Извечный спор: язык это или нет? Тьюринг-полный? Нет. Но без него ваш React — просто JSON с нервным расстройством.')],
[4,13,E(48,'Wp','Webpack','📦','tool','Сборщик, конфиг которого сложнее самого проекта. Лоадеры, плагины, tree shaking — а бандл всё равно 15 МБ. Vite пришёл на замену, но webpack бессмертен.')],
[4,14,E(49,'Np','npm','🧶','tool','Менеджер пакетов, где один проект тянет 1400 зависимостей. Папка node_modules — самый тяжёлый объект во вселенной. Тяжелее чёрной дыры. Это научный факт.')],
[4,15,E(50,'Ts','TypeScript','💙','lang','JavaScript с типами, которые все обходят через «any». Обещает безопасность. Реальность: as unknown as MyType. Ошибки компилятора длиной в экран — бесценны.')],
[4,16,E(51,'Wa','WebAssembly','⚙','concept','Бинарный формат для веба. Теперь Doom в браузере с нативной скоростью. Зачем? Потому что можем. Linux в браузере? Уже сделали. Что дальше? Браузер в браузере.')],
[4,17,E(52,'Mm','Mem. Leak','💧','bug','Утечка памяти: программа ест RAM как голодный бегемот. Находится в пятницу, когда прод упал, а вы уже в баре. Сборщик мусора тихо рыдает.')],
[4,18,E(53,'Uf','Undefined','?','bug','Самая частая ошибка в JS. «undefined is not a function» — мантра фронтендера. Null — осознанное отсутствие. Undefined — просто забыли. Разницу знают 12% разработчиков.')],

[5,1, E(54,'Dd','Дедлайн','⏰','human','Мифическая точка во времени. Закон Хофштадтера: «Всегда дольше, чем ожидаешь, даже если учёл этот закон». Дедлайн — когда PM начинает стоять за спиной и дышать в затылок.')],
[5,2, E(55,'Mt','Митинг','🗣','human','Собрание, где 8 человек обсуждают то, что двое могли решить за 5 минут. «У меня идея — назначим ещё один митинг!» Длительность: 30 мин по плану, 90 мин по факту.')],
